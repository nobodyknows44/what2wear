<text x="59.0" y="1455.3" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">1. Все размеры в метрах, сняты по внутренним граням стен (эскиз IMG_2445).</text>
<text x="59.0" y="1469.0" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">2. Толщина стен на чертеже условная: наружные 300 мм, внутренние 125 мм (125 мм — замер с эскиза).</text>
<text x="59.0" y="1482.8" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">Замеренные толщины перегородок на эскизе: 0,075 / 0,11 / 0,12 / 0,125.</text>
<text x="59.0" y="1496.5" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">3. Комната 1 замыкается точно по замерам: запад 0,559+0,560+5,316 = 6,435; восток 1,318+0,540+5,275 = 7,133;</text>
<text x="59.0" y="1510.3" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">низ 2,513 + 0,613 (проём) = 3,126; уступ 0,45+0,242 = 0,692 ≈ 0,698.</text>
<text x="59.0" y="1524.0" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">4. Скошенный участок стены прихожей у входа (замеры 0,515 / 0,502 / 0,647 / 0,629 при толщине 0,11)</text>
<text x="59.0" y="1537.8" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">показан прямым — геометрию угла нужно уточнить.</text>
<text x="59.0" y="1551.5" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">5. Размеры 0,155 / 0,172 / 0,2 / 0,1 / 0,735 / 0,05 / 0,15 однозначно не привязаны к эскизу — уточнить.</text>
<text x="59.0" y="1565.3" text-anchor="start" font-family="Helvetica,Arial" font-size="11.0" font-weight="normal" fill="#000000">6. Назначение помещений на эскизе не указано — подписи и расположение дверей условные.</text>
</g>
</svg>